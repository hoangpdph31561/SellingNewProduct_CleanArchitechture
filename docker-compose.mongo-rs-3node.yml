# Local MongoDB as a 3-NODE REPLICA SET (rs0) — 1 PRIMARY + 2 SECONDARY.
#
# This gives TRUE high availability (automatic failover) + read scaling, on top of
# the multi-document transactions a replica set unlocks. If you only need
# transactions, the simpler single-node file docker-compose.mongo-rs.yml is enough.
#
# ── IMPORTANT: host networking ──────────────────────────────────────────────
# A replica set advertises its members by the host:port passed to rs.initiate().
# BOTH the nodes (inside Docker) AND the client (the app, running on your host)
# must be able to reach each advertised address. The trick used here: advertise
# mongo1:27017 / mongo2:27018 / mongo3:27019 and PUBLISH the same ports, so the
# address is identical inside and outside Docker. You MUST map those names to
# localhost on the host machine:
#
#   Windows: edit C:\Windows\System32\drivers\etc\hosts as Administrator, add:
#     127.0.0.1 mongo1 mongo2 mongo3
#   Linux/macOS: add the same line to /etc/hosts.
#
# ── Usage ───────────────────────────────────────────────────────────────────
#   docker compose -f docker-compose.mongo-rs-3node.yml up -d
# The `mongo-init` one-shot container runs rs.initiate() once all nodes are up.
#
# App connection string (set ConnectionStrings:MongoDB in appsettings.json):
#   mongodb://mongo1:27017,mongo2:27018,mongo3:27019/?replicaSet=rs0&readPreference=primary
#
# Inspect the cluster:  docker exec -it snp-mongo1 mongosh --port 27017 --eval "rs.status()"

services:
  mongo1:
    image: mongo:7
    container_name: snp-mongo1
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongo1-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27017", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo2:
    image: mongo:7
    container_name: snp-mongo2
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27018"]
    ports:
      - "27018:27018"
    volumes:
      - mongo2-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27018", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo3:
    image: mongo:7
    container_name: snp-mongo3
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27019"]
    ports:
      - "27019:27019"
    volumes:
      - mongo3-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27019", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo-init:
    image: mongo:7
    container_name: snp-mongo-init-3node
    depends_on:
      mongo1:
        condition: service_healthy
      mongo2:
        condition: service_healthy
      mongo3:
        condition: service_healthy
    restart: "no"
    # Initiate the 3-member set once. mongo1 gets the highest priority so it is the
    # preferred PRIMARY; mongo2/mongo3 start as SECONDARY. Hosts must match exactly
    # what the app and the other nodes will dial (see the header note).
    entrypoint:
      - bash
      - -c
      - |
        mongosh --host mongo1:27017 --quiet --eval '
          try {
            rs.status();
            print("Replica set already initiated.");
          } catch (e) {
            rs.initiate({
              _id: "rs0",
              members: [
                { _id: 0, host: "mongo1:27017", priority: 2 },
                { _id: 1, host: "mongo2:27018", priority: 1 },
                { _id: 2, host: "mongo3:27019", priority: 1 }
              ]
            });
            print("Replica set rs0 initiated (3 nodes: 1 primary + 2 secondary).");
          }'

volumes:
  mongo1-data:
  mongo2-data:
  mongo3-data:
